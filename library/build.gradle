apply plugin: 'com.android.library'
apply plugin: 'maven-publish'

android {
    compileSdkVersion 34
    defaultConfig {
        minSdkVersion 23
        targetSdkVersion 34
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
}

// Create sources and Javadoc JAR tasks
task androidSourcesJar(type: Jar) {
    archiveClassifier.set("sources")
    from android.sourceSets.main.java.srcDirs
}

task androidJavadocJar(type: Jar) {
    archiveClassifier.set("javadoc")
    from android.sourceSets.main.java.srcDirs
}

publishing {
    publications {
        aar(MavenPublication) {
            groupId = 'com.github.BaluNaik'
            artifactId = 'Android-SpinKit'
            version = '1.4.1'

            // Use the Android component (release variant) for publishing
            artifact("$buildDir/outputs/aar/library-release.aar") // Ensure you're using the correct release component here

            // Attach the sources and javadoc artifacts
            artifact androidSourcesJar
            artifact androidJavadocJar
        }
    }

    repositories {
        maven {
            url = uri("https://jitpack.io") // Publish to JitPack
        }
    }
}
